version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: trendsee-db
    environment:
      POSTGRES_USER: trendsee
      POSTGRES_PASSWORD: trendseepassword
      POSTGRES_DB: trendsee
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trendsee"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trendsee-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./backend
    container_name: trendsee-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://trendsee:trendseepassword@db:5432/trendsee
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=supersecretkey
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    container_name: trendsee-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # prevents overriding node_modules from container
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    # Run dev server inside container
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  redisdata:
